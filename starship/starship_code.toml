add_newline = false
follow_symlinks = true
palette = 'ash'

format = """
$username\
$hostname\
$localip\
$shlvl\
$singularity\
$kubernetes\
$directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$hg_state\
$pijul_channel\
$docker_context\
$package\
$c\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$vagrant\
$zig\
$buf\
$nix_shell\
$conda\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$nats\
$direnv\
$env_var\
$mise\
$crystal\
$custom\
$sudo\
$cmd_duration\
$fill\
$jobs\
$battery\
$time\
$status\
$os\
$container\
$netns\
$shell\
$line_break\
$character"""

[fill]
symbol = ' '

[[battery.display]]
threshold = 15
style = 'bold red blink'


[os]
disabled = true

[os.symbols]
Arch = '󰣇 '
Debian = ' '
Ubuntu = ' '


[time]
disabled = true
format = '[  $time ]($style) '
time_format = '%T'
time_range = '00:00:00-23:59:59'
style = 'green bold dimmed'

[character]
success_symbol = '[](bold green)'
error_symbol = '[](bold red)'

[username]
style_user = 'red bold'
style_root = 'yellow bold'
format = '[$user]($style)'
disabled = false
show_always = false

[directory]
truncation_symbol = '.../'

[git_branch]
style = 'green bold'
symbol = ' '

[git_commit]
only_detached = false
tag_disabled = false
style = 'green dimmed'
tag_symbol = ' 󰓹 '

[git_state]
rebase = '  Rebasing '
merge = '  Merging '
revert = ' 󰹿 Reverting '
cherry_pick = '  Cherry Picking '
bisect = ' 󰃤 Bisecting '
am = ' 󰶋  Applying Mailbox '
am_or_rebase = '  /󰶋  '
style = 'yellow blink'

[git_metrics]
disabled = false

[git_status]
conflicted = ''
ahead = ' ${count}'
behind = ' ${count}'
diverged = '󰃻  ${ahead_count}  ${behind_count}'
up_to_date = ''
untracked = ''
stashed = ''
modified = ''
staged = ''
renamed = ''
deleted = ''
typechanged = ''
style = 'bold yellow'

[hostname]
style = 'red bold dimmed'
format = '[@](blue bold)[$hostname]($style)[ in ](white)'
ssh_only = true


[palettes.ash]
red = '#EF555B'
blue = '#4BD6EA'
yellow = '#ffff00'
green = '#20FB9E'
magenta = '#ff2bd6'
